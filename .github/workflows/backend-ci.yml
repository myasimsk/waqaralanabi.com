name: Backend checks

on:
  push:
    branches:
      - main
      - storefront-preview
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript typecheck and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wa_test
          POSTGRES_PASSWORD: wa_test
          POSTGRES_DB: wa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wa_test -d wa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run PostgreSQL concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://wa_test:wa_test@localhost:5432/wa_test
        run: node --test tests/*.test.mjs
      - name: Typecheck backend
        run: npm run typecheck
      - name: Build backend
        run: npm run build
