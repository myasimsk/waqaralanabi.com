<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#170b10">
  <title>WAQAR AL ANABI — Coming Soon</title>
  <meta name="description" content="A new chapter in premium fashion. Waqar Al Anabi is coming soon.">
  <meta property="og:title" content="WAQAR AL ANABI — Coming Soon">
  <meta property="og:description" content="A new chapter in premium fashion.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="prelaunch" id="prelaunch">
    <div class="ambient ambient--top" aria-hidden="true"></div>
    <div class="ambient ambient--bottom" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="brand-stage">
      <div class="brand-content" id="brandContent">
        <p class="eyebrow">A NEW CHAPTER IN FASHION</p>
        <img src="logo.svg" class="brand-logo" alt="Waqar Al Anabi" fetchpriority="high">
        <div class="fine-rule" aria-hidden="true"><span></span></div>
        <h1>Something big is loading.</h1>
        <p class="brand-description">A new perspective on premium fashion.<br>Thoughtfully imagined. Coming soon.</p>
        <a class="instagram-link" href="https://instagram.com/waqar_al_anabi" target="_blank" rel="noopener noreferrer" aria-label="Follow Waqar Al Anabi on Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="18" cy="6.5" r="1"></circle>
          </svg>
          <span>FOLLOW OUR JOURNEY</span>
          <span class="instagram-handle">@waqar_al_anabi</span>
        </a>
      </div>

      <div class="curtain curtain--left" aria-hidden="true">
        <div class="curtain-folds"></div>
        <div class="curtain-edge"></div>
      </div>
      <div class="curtain curtain--right" aria-hidden="true">
        <div class="curtain-folds"></div>
        <div class="curtain-edge"></div>
      </div>
      <div class="center-seam" aria-hidden="true"></div>
      <div class="stage-vignette" aria-hidden="true"></div>
    </div>

    <div class="bottom-line">
      <span>WAQAR AL ANABI</span>
      <span class="bottom-dot" aria-hidden="true"></span>
      <span>LAUNCHING SOON</span>
    </div>

    <button class="replay-button" id="replayReveal" type="button" aria-label="Replay the curtain reveal">
      Replay reveal <span aria-hidden="true">↻</span>
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
